[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-phone-remote"
version = "1.0.0"
description = "A private, touch-first iPhone remote for every display on your Mac."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]

[project.scripts]
mac-phone-remote = "mac_phone_remote.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mac_phone_remote = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
